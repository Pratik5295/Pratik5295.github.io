<article class="project-template">
    <a class="project-card-link" href="#">
        <div class="project-card-media">
            <img class="projImage" alt="" width="1600" height="900" loading="lazy" decoding="async">
            <span class="project-image-fallback" data-image-placeholder hidden>Preview unavailable</span>
        </div>
        <div class="project-card-content">
            <div class="project-card-meta">
                <span class="projEngine"></span>
                <span class="projStatus"></span>
            </div>
            <h3 class="projTitle"></h3>
            <p class="projFocus"></p>
            <p class="projSummary"></p>
            <span class="project-card-cta">View project <span aria-hidden="true">↗</span></span>
        </div>
    </a>
</article>
