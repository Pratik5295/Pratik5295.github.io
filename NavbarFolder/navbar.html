<script>
    (function () {
        // ---- Compact nav on scroll ----
        var wrapper = document.getElementById('nav-wrapper');
        function updateCompact() {
            if (!wrapper) return;
            wrapper.classList.toggle('nav-compact', window.scrollY > 80);
        }
        window.addEventListener('scroll', updateCompact, { passive: true });
        updateCompact();

        // ---- Hamburger toggle ----
        var btn = document.getElementById('hamburger');
        var menu = document.getElementById('navbar-menu');
        if (btn && menu) {
            btn.addEventListener('click', function () {
                btn.classList.toggle('active');
                menu.classList.toggle('open');
            });
        }

        // ---- Dropdown toggle ----
        var dropdownEl = document.getElementById('nav-dropdown');
        var dropdownToggle = dropdownEl ? dropdownEl.querySelector('.dropdown-toggle') : null;
        var dropdownMenu = dropdownEl ? dropdownEl.querySelector('.dropdown-menu') : null;

        if (dropdownToggle && dropdownMenu) {
            dropdownToggle.addEventListener('click', function (e) {
                e.preventDefault();
                var open = dropdownEl.classList.toggle('open');
                dropdownToggle.setAttribute('aria-expanded', open);
            });

            // Close when clicking outside
            document.addEventListener('click', function (e) {
                if (dropdownEl && !dropdownEl.contains(e.target)) {
                    dropdownEl.classList.remove('open');
                    dropdownToggle.setAttribute('aria-expanded', 'false');
                }
            });

            // Close dropdown + mobile menu when a dropdown link is clicked
            dropdownMenu.querySelectorAll('a').forEach(function (link) {
                link.addEventListener('click', function () {
                    dropdownEl.classList.remove('open');
                    dropdownToggle.setAttribute('aria-expanded', 'false');
                    if (menu && menu.classList.contains('open')) {
                        btn.classList.remove('active');
                        menu.classList.remove('open');
                    }
                });
            });
        }

        // Close mobile menu when a top-level non-dropdown link is clicked
        if (menu) {
            menu.querySelectorAll('ul > li:not(.dropdown) > a').forEach(function (link) {
                link.addEventListener('click', function () {
                    if (menu.classList.contains('open')) {
                        btn.classList.remove('active');
                        menu.classList.remove('open');
                    }
                });
            });
        }

        // ---- Active page highlight ----
        var currentPath = window.location.pathname;
        document.querySelectorAll('nav.navbar ul li a').forEach(function (link) {
            var href = link.getAttribute('href') || '';
            if (href.startsWith('http') || href.startsWith('#') || href.indexOf('#') !== -1) return;
            var isHome = href === '/' && (currentPath === '/' || currentPath.endsWith('/index.html') || currentPath === '');
            var isMatch = href !== '/' && currentPath.indexOf(href.replace(/^\//, '')) !== -1;
            if (isHome || isMatch) link.classList.add('active');
        });

        // ---- Typewriter effect ----
        var el = document.getElementById('typewriter');
        if (el && !el.dataset.init) {
            el.dataset.init = '1';
            el.textContent = 'Game Developer';
        }
    })();
</script>
