<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found — Pratik Shringarpure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/Images/Logo.png" type="image/png">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; padding: 2rem clamp(1.25rem, 5vw, 4rem); min-height: 100vh; display: flex; flex-direction: column; background: #070b0d; color: #edf3ef; font-family: 'Inter', Verdana, sans-serif; }
        .logo { display: inline-flex; align-items: center; min-height: 44px; color: #edf3ef; font-size: 1.125rem; font-weight: 600; letter-spacing: -0.025em; text-decoration: none; }
        main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 4rem 0; max-width: 42rem; overflow-wrap: anywhere; }
        .error-code { margin: 0 0 1.25rem; color: #27e69b; font-size: 0.875rem; font-weight: 600; }
        h1 { margin: 0; font-size: clamp(2.25rem, 6vw, 3.5rem); font-weight: 600; line-height: 1.15; letter-spacing: -0.045em; }
        .explanation { max-width: 48ch; margin: 1.5rem 0 2rem; color: #c7ccd0; font-size: 1rem; line-height: 1.8; }
        .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .actions a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0.75rem 1.1rem; border: 1px solid #27e69b; border-radius: 6px; background: #27e69b; color: #05100d; font-size: 0.875rem; line-height: 1.5; font-weight: 600; text-decoration: none; }
        .actions .secondary { border-color: #687479; color: #c7ccd0; background: transparent; }
        .actions a:hover { background: #70efbf; color: #05100d; }
        a:focus-visible { outline: 2px solid #27e69b; outline-offset: 4px; }
    </style>
</head>
<body>
    <header><a href="/" class="logo">Pratik Shringarpure</a></header>
    <main>
        <p class="error-code">Error 404</p>
        <h1>Page not found</h1>
        <p class="explanation">The page may have moved, or the link may be out of date. You can find my projects and experience through the links below.</p>
        <nav class="actions" aria-label="Find another page">
            <a href="/">Back to portfolio</a>
            <a class="secondary" href="/Pages/aboutme.html">About &amp; résumé</a>
        </nav>
    </main>
</body>
</html>
