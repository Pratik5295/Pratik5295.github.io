<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Project — Pratik Shringarpure</title>
    <meta name="description" content="Project detail — Pratik Shringarpure game developer portfolio.">

    <!-- Open Graph (populated dynamically by project.js) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pratik Shringarpure — Game Developer">
    <meta id="og-title"       property="og:title"       content="Project — Pratik Shringarpure">
    <meta id="og-description" property="og:description" content="Game developer portfolio project.">
    <meta id="og-image"       property="og:image"       content="/Images/ProjectData/Profile.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="project.css">
    <link rel="stylesheet" href="../NavbarFolder/navbar.css">
    <link rel="stylesheet" href="../FooterFolder/footer.css">
    <link rel="icon" href="../Images/Logo.png" type="image/x-icon">
    <script src="../Scripts/HtmlLoader.js"></script>
    <script src="../Scripts/animations.js"></script>
</head>
<body>

    <div id="scroll-progress"></div>
    <button id="back-to-top" aria-label="Back to top">&#8679;</button>

    <div id="navbar"></div>

    <main id="project-content">

        <!-- Breadcrumb -->
        <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
            <a href="/">Home</a>
            <span class="breadcrumb-sep">›</span>
            <span id="breadcrumb-title">Project</span>
        </nav>

        <!-- Hero banner -->
        <div class="project-hero" id="project-hero">
            <div class="project-hero-content">
                <h1 id="project-title"></h1>
                <p class="project-subtitle" id="project-subtitle"></p>
                <div class="project-meta">
                    <span class="meta-badge engine" id="project-engine"></span>
                    <span class="meta-badge status" id="project-status"></span>
                </div>
            </div>
        </div>

        <section class="project-section" id="description-section">
            <h2 class="section-label">Description</h2>
            <p id="project-description"></p>
        </section>

        <section class="project-section" id="video-section" style="display:none;">
            <h2 class="section-label">Video</h2>
            <div class="video-wrapper">
                <iframe id="project-video" title="Project Video" frameborder="0" allowfullscreen></iframe>
            </div>
        </section>

        <section class="project-section" id="highlights-section" style="display:none;">
            <h2 class="section-label">Highlights</h2>
            <ul id="highlights-list" class="highlights-list"></ul>
        </section>

        <div class="two-column">
            <section class="project-section" id="roles-section" style="display:none;">
                <h2 class="section-label">Role</h2>
                <ul id="roles-list"></ul>
            </section>
            <section class="project-section" id="tech-section" style="display:none;">
                <h2 class="section-label">Tech Used</h2>
                <div class="tech-tags" id="tech-list"></div>
            </section>
        </div>

        <section class="project-section" id="details-section" style="display:none;">
            <h2 class="section-label">Project Details</h2>
            <p id="project-details"></p>
        </section>

        <div id="download-section" style="display:none;">
            <a id="download-link" class="download-btn" target="_blank">Download Playable Build</a>
        </div>

        <div id="store-section" style="display:none;">
            <a id="store-link" class="download-btn store-btn" target="_blank"></a>
        </div>

        <!-- Prev / Next navigation -->
        <div class="project-nav" id="project-nav" style="display:none;">
            <a class="project-nav-btn prev-btn" id="prev-project" href="#">&#8592; Previous</a>
            <a class="project-nav-btn next-btn" id="next-project" href="#">Next &#8594;</a>
        </div>

    </main>

    <div id="footer-container"></div>

    <script>
        LoadPage("../NavbarFolder/navbar.html", "navbar");
        LoadPage("../FooterFolder/footer.html", "footer-container");
    </script>
    <script src="project.js"></script>
    <script src="../Scripts/ui.js"></script>
</body>
</html>
